<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Panel de textos</title>
  <link rel="stylesheet" href="styles.css?v=20261015-send-slim-2">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="eyebrow">ESPACIO PÚBLICO</div>
      <h1>Panel de textos</h1>
      <p>Envía un texto para procesarlo.</p>
    </header>

    <section class="send-strip" aria-label="Enviar texto">
      <form id="send-form" class="send-form">
        <label class="visually-hidden" for="input-text">Texto para enviar</label>
        <textarea id="input-text" class="send-field" name="text" rows="1" wrap="off" maxlength="20000" placeholder="Pega tu texto aquí…" aria-label="Pega o escribe el texto que quieres enviar" required></textarea>
        <button id="send-button" class="send-button" type="submit">Enviar</button>
        <div class="honeypot" aria-hidden="true">
          <label for="website">No rellenar</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
      </form>
      <p id="send-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="links-area" aria-label="Copiar archivos">
      <button id="links-toggle" class="links-toggle" type="button" aria-expanded="false" aria-controls="links-panel">
        Links <span id="links-chevron" aria-hidden="true">⌄</span>
      </button>
      <div id="links-panel" class="links-panel" hidden>
        <div class="copy-item">
          <span id="time-ino" class="last-updated">Última actualización: consultando…</span>
          <button id="copy-ino" class="file-chip" type="button" disabled>.ino</button>
        </div>
        <div class="copy-item">
          <span id="time-json" class="last-updated">Última actualización: consultando…</span>
          <button id="copy-json" class="file-chip" type="button" disabled>.json</button>
        </div>
        <div class="copy-item">
          <span id="time-extra" class="last-updated">Última actualización: consultando…</span>
          <button id="copy-extra" class="file-chip" type="button" disabled>.txt</button>
        </div>
        <p id="links-status" class="links-status" role="status" aria-live="polite"></p>
        <button id="refresh-button" class="refresh-button" type="button">Actualizar horas</button>
      </div>
    </section>

    <footer>Los envíos y archivos son públicos. No incluyas contraseñas ni información privada.</footer>
  </main>
  <script src="config.js?v=20261015-send-slim-2"></script>
  <script src="app.js?v=20261015-send-slim-2"></script>
</body>
</html>
